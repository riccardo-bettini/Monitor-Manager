[package]
name = "monitor-manager"
version = "1.0.0"
edition = "2021"
description = "Universal DDC/CI Monitor Manager with Apple iOS 26 Liquid Glass UI"
authors = ["Riccardo Bettini"]

[package.metadata.monitor_manager]
display_version = "1.00"
github_repo = "riccardo-bettini/Monitor-Manager"

[[bin]]
name = "monitor-manager"
path = "src/main.rs"

[[bin]]
name = "Monitor-Manager-Setup"
path = "src/bin/setup.rs"

[dependencies]
tao = { version = "0.30", features = ["rwh_05"] }
wry = { version = "0.47", features = ["transparent"] }
tray-icon = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Display",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
