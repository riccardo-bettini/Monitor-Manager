[package]
name = "monitor-manager"
version = "1.0.5"
edition = "2021"
description = "Ultra-Lightweight Native DDC/CI Monitor Manager"
authors = ["Riccardo Bettini"]

[package.metadata.monitor_manager]
display_version = "1.05"
github_repo = "riccardo-bettini/Monitor-Manager"

[[bin]]
name = "monitor-manager"
path = "src/main.rs"

[[bin]]
name = "Monitor-Manager-Setup"
path = "src/bin/setup.rs"

[dependencies]
slint = { version = "1.9", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "raw-window-handle-06",
] }
tray-icon = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Devices_Display",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }

[build-dependencies]
slint-build = "1.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
